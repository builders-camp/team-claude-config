name: Auto Assign & Request Review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Two-person team: whoever opens the PR gets the other one requested as reviewer.
            const pairs = {
              taga1420: 'AndreAlbuquerque',
              AndreAlbuquerque: 'taga1420',
            };

            const author = context.payload.pull_request.user.login;
            const pr_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: pr_number,
              assignees: [author],
            });

            if (context.payload.pull_request.draft) return;

            const reviewer = pairs[author];
            if (!reviewer) return;

            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number: pr_number,
              reviewers: [reviewer],
            });
