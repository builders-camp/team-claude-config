<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

  :root {
    --green: #26A355;
    --black: #000000;
    --muted: #6b6b6b;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1200px;
    height: 630px;
  }

  body {
    position: relative;
    background: #ffffff;
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
    /* dotted texture */
    background-image: radial-gradient(rgba(0,0,0,0.10) 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    background-position: -6px -6px;
  }

  /* soft green glow, top right */
  .glow {
    position: absolute;
    top: -120px;
    right: -160px;
    width: 620px;
    height: 620px;
    background: radial-gradient(circle at center, rgba(38,163,85,0.22) 0%, rgba(38,163,85,0.10) 35%, rgba(38,163,85,0) 70%);
    pointer-events: none;
  }

  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 54px 72px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    background: var(--black);
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    padding: 10px 20px;
    border-radius: 999px;
  }

  .wordmark {
    color: #8a8a8a;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.14em;
  }

  .eyebrow {
    margin-top: 74px;
    color: var(--green);
    font-weight: 600;
    font-size: 25px;
  }

  h1 {
    margin-top: 14px;
    color: var(--black);
    font-weight: 800;
    font-size: 68px;
    line-height: 1.08;
    letter-spacing: -0.025em;
  }
  h1 .accent { color: var(--green); }

  p.sub {
    margin-top: 24px;
    max-width: 620px;
    color: var(--muted);
    font-weight: 400;
    font-size: 22px;
    line-height: 1.55;
  }

  .pills {
    margin-top: 46px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    border-radius: var(--radius);
    font-weight: 700;
    font-size: 21px;
    padding: 18px 26px;
  }
  .pill.solid {
    background: var(--green);
    color: #ffffff;
  }
  .pill.outline {
    background: #ffffff;
    color: var(--black);
    border: 1.5px solid #d9d9d9;
    font-weight: 500;
  }
  .pill.outline b { font-weight: 700; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame">
    <div class="top-row">
      <span class="badge">{{BADGE}}</span>
      <span class="wordmark">BUILDERS CAMP</span>
    </div>

    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{HEADLINE_HTML}}</h1>
    <p class="sub">{{SUBTEXT}}</p>

    <div class="pills">
      <span class="pill solid">{{PILL_1}}</span>
      <span class="pill outline">{{PILL_2_HTML}}</span>
    </div>
  </div>
</body>
</html>
